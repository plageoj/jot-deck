[package]
name = "jot-deck-reporter-host"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
jot-deck-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Parse the `expected_updated_at` CAS timestamp from card.patch params.
chrono = "0.4"
# Generate a per-Reporter connection id (ULID) for write attribution.
ulid = "3"
