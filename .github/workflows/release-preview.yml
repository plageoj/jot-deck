name: Release (Preview)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'

# Least-privilege default; only jobs that publish/mutate the release elevate to write.
permissions:
  contents: read

concurrency:
  group: release-preview
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview_num: ${{ steps.version.outputs.preview_num }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Need full history to count commits since the base-version file
          # was last touched. The repo is small enough that the cost is negligible.
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Compute preview version
        run: |
          set -euo pipefail
          BASE_FILE=packages/app/preview-base-version.txt
          BASE=$(tr -d '[:space:]' < "$BASE_FILE")
          if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$BASE_FILE must contain bare MAJOR.MINOR.PATCH (got '$BASE')"
            exit 1
          fi
          BASE_COMMIT=$(git log -1 --format=%H -- "$BASE_FILE")
          if [ -z "$BASE_COMMIT" ]; then
            echo "::error::no git history for $BASE_FILE"
            exit 1
          fi
          NUM=$(git rev-list --count "${BASE_COMMIT}..HEAD")
          if [ "$NUM" -gt 65535 ]; then
            echo "::error::preview build number $NUM exceeds MSI limit (65535). Bump $BASE_FILE."
            exit 1
          fi
          # Numeric-only pre-release (e.g. 0.1.0-42): the Windows MSI/WiX
          # bundler rejects non-numeric pre-release identifiers. Must match
          # the string scripts/sync-version.mjs --preview produces, since the
          # cleanup step matches release assets by this exact version.
          echo "version=${BASE}-${NUM}" >> "$GITHUB_OUTPUT"
          echo "preview_num=${NUM}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    permissions:
      contents: write # tauri-action creates/uploads the preview release
    strategy:
      fail-fast: false
      # Serialize matrix uploads so tauri-action's read-modify-write of
      # latest.json on the same release tag can't race across platforms.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: '--config src-tauri/tauri.conf.preview.json --target universal-apple-darwin'
          - platform: ubuntu-latest
            args: '--config src-tauri/tauri.conf.preview.json'
          - platform: windows-latest
            args: '--config src-tauri/tauri.conf.preview.json'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            packages/app/src-tauri -> target
            crates/core -> target

      - run: pnpm install

      - name: Bump version for preview
        shell: bash
        run: node scripts/sync-version.mjs --preview ${{ needs.prepare.outputs.preview_num }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          tagName: preview
          releaseName: 'Jot Deck Preview (${{ needs.prepare.outputs.version }})'
          releaseBody: 'Rolling preview build from commit ${{ github.sha }}. Production data is unaffected — preview installs as a separate app.'
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  publish-manifest:
    name: Promote updater manifest & clean stale assets
    needs: [prepare, build]
    # Run even when one platform build failed, so stale bundles from prior
    # preview pushes can't pile up on the rolling `preview` release. Each step
    # guards itself (see below) so a partial build can never corrupt the live
    # updater manifest. Requires prepare to have produced the version string.
    if: always() && needs.prepare.result == 'success'
    permissions:
      contents: write # promotes/deletes release assets via gh
    runs-on: ubuntu-latest
    steps:
      - name: Promote latest.json → latest-preview.json
        # Only when EVERY platform built. tauri-action writes latest.json
        # incrementally per successful platform, so on a partial failure it
        # would reference bundles that were never uploaded — promoting that
        # breaks updates for the missing platform. On partial failure we skip
        # this and the prior latest-preview.json keeps serving the last
        # fully-good build. --clobber atomically overwrites the prior manifest,
        # so installed Preview clients see a valid manifest at every moment.
        if: needs.build.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tmp && cd tmp
          gh release download preview \
            --repo "${{ github.repository }}" \
            --pattern 'latest.json'
          mv latest.json latest-preview.json
          gh release upload preview latest-preview.json \
            --repo "${{ github.repository }}" \
            --clobber
          gh release delete-asset preview latest.json \
            --repo "${{ github.repository }}" --yes

      - name: Delete stale bundles from prior preview builds
        # Runs on every green-prepare run, including partial build failures, so
        # leftover bundles never accumulate. Bundle filenames embed the version;
        # two versions are protected from deletion:
        #   - KEEP_VERSION: the version this run built (may be only partial)
        #   - the version the live latest-preview.json still points at
        # so we never delete the bundles installed clients are updating from.
        # On the very first run neither has assets yet and nothing is deleted.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Version currently served to clients (empty until the first promote).
          tmpdir=$(mktemp -d)
          gh release download preview --repo "$REPO" \
            --pattern 'latest-preview.json' --dir "$tmpdir" 2>/dev/null || true
          LIVE_VERSION=$(jq -r '.version // empty' "$tmpdir/latest-preview.json" 2>/dev/null || true)
          echo "Keeping version '$KEEP_VERSION'${LIVE_VERSION:+ and live version '$LIVE_VERSION'}"
          gh release view preview \
            --repo "$REPO" \
            --json assets --jq '.assets[].name' \
          | while IFS= read -r asset; do
              case "$asset" in
                latest-preview.json) continue ;;
                *"$KEEP_VERSION"*) continue ;;
              esac
              if [ -n "$LIVE_VERSION" ]; then
                case "$asset" in
                  *"$LIVE_VERSION"*) continue ;;
                esac
              fi
              echo "Deleting stale asset: $asset"
              gh release delete-asset preview "$asset" \
                --repo "$REPO" --yes
            done
