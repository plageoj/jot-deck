name: Release (Preview)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'

# Least-privilege default; only jobs that publish/mutate the release elevate to write.
permissions:
  contents: read

concurrency:
  group: release-preview
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview_num: ${{ steps.version.outputs.preview_num }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Need full history to count commits since the base-version file
          # was last touched. The repo is small enough that the cost is negligible.
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Compute preview version
        run: |
          set -euo pipefail
          BASE_FILE=packages/app/preview-base-version.txt
          BASE=$(tr -d '[:space:]' < "$BASE_FILE")
          if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$BASE_FILE must contain bare MAJOR.MINOR.PATCH (got '$BASE')"
            exit 1
          fi
          BASE_COMMIT=$(git log -1 --format=%H -- "$BASE_FILE")
          if [ -z "$BASE_COMMIT" ]; then
            echo "::error::no git history for $BASE_FILE"
            exit 1
          fi
          NUM=$(git rev-list --count "${BASE_COMMIT}..HEAD")
          if [ "$NUM" -gt 65535 ]; then
            echo "::error::preview build number $NUM exceeds MSI limit (65535). Bump $BASE_FILE."
            exit 1
          fi
          echo "version=${BASE}-preview.${NUM}" >> "$GITHUB_OUTPUT"
          echo "preview_num=${NUM}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    permissions:
      contents: write # tauri-action creates/uploads the preview release
    strategy:
      fail-fast: false
      # Serialize matrix uploads so tauri-action's read-modify-write of
      # latest.json on the same release tag can't race across platforms.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: '--config src-tauri/tauri.conf.preview.json --target universal-apple-darwin'
          - platform: ubuntu-latest
            args: '--config src-tauri/tauri.conf.preview.json'
          - platform: windows-latest
            args: '--config src-tauri/tauri.conf.preview.json'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            packages/app/src-tauri -> target
            crates/core -> target

      - run: pnpm install

      - name: Bump version for preview
        shell: bash
        run: node scripts/sync-version.mjs --preview ${{ needs.prepare.outputs.preview_num }}

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          tagName: preview
          releaseName: 'Jot Deck Preview (${{ needs.prepare.outputs.version }})'
          releaseBody: 'Rolling preview build from commit ${{ github.sha }}. Production data is unaffected — preview installs as a separate app.'
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  publish-manifest:
    name: Promote updater manifest & clean stale assets
    needs: [prepare, build]
    permissions:
      contents: write # promotes/deletes release assets via gh
    runs-on: ubuntu-latest
    steps:
      - name: Promote latest.json → latest-preview.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --clobber atomically overwrites the prior latest-preview.json,
        # so installed Preview clients see a valid manifest at every moment.
        # If this job is skipped due to a partial build failure, the prior
        # latest-preview.json (pointing at the prior build's bundles) stays
        # intact and clients keep working until the next green run.
        run: |
          set -euo pipefail
          mkdir -p tmp && cd tmp
          gh release download preview \
            --repo "${{ github.repository }}" \
            --pattern 'latest.json'
          mv latest.json latest-preview.json
          gh release upload preview latest-preview.json \
            --repo "${{ github.repository }}" \
            --clobber
          gh release delete-asset preview latest.json \
            --repo "${{ github.repository }}" --yes

      - name: Delete stale bundles from prior preview builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_VERSION: ${{ needs.prepare.outputs.version }}
        # Bundle filenames embed the version, so anything not matching the
        # version we just published is leftover from a prior preview push.
        # Keep latest-preview.json regardless.
        run: |
          set -euo pipefail
          gh release view preview \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' \
          | while IFS= read -r asset; do
              case "$asset" in
                latest-preview.json) continue ;;
                *"$KEEP_VERSION"*) continue ;;
              esac
              echo "Deleting stale asset: $asset"
              gh release delete-asset preview "$asset" \
                --repo "${{ github.repository }}" --yes
            done
