name: Release (Preview)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'

# Least-privilege default; only jobs that publish/mutate the release elevate to write.
permissions:
  contents: read

concurrency:
  group: release-preview
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview_num: ${{ steps.version.outputs.preview_num }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Need full history to count commits since the base-version file
          # was last touched. The repo is small enough that the cost is negligible.
          fetch-depth: 0
          persist-credentials: false

      - id: version
        name: Compute preview version
        run: |
          set -euo pipefail
          BASE_FILE=packages/app/preview-base-version.txt
          BASE=$(tr -d '[:space:]' < "$BASE_FILE")
          if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$BASE_FILE must contain bare MAJOR.MINOR.PATCH (got '$BASE')"
            exit 1
          fi
          BASE_COMMIT=$(git log -1 --format=%H -- "$BASE_FILE")
          if [ -z "$BASE_COMMIT" ]; then
            echo "::error::no git history for $BASE_FILE"
            exit 1
          fi
          NUM=$(git rev-list --count "${BASE_COMMIT}..HEAD")
          if [ "$NUM" -gt 65535 ]; then
            echo "::error::preview build number $NUM exceeds MSI limit (65535). Bump $BASE_FILE."
            exit 1
          fi
          # Numeric-only pre-release (e.g. 0.1.0-42): the Windows MSI/WiX
          # bundler rejects non-numeric pre-release identifiers. Must match
          # the string scripts/sync-version.mjs --preview produces, since the
          # cleanup step matches release assets by this exact version.
          echo "version=${BASE}-${NUM}" >> "$GITHUB_OUTPUT"
          echo "preview_num=${NUM}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    permissions:
      contents: write # tauri-action creates/uploads the per-platform staging release
    strategy:
      # Builds run fully in parallel. There is no cross-platform race on the
      # updater manifest because each platform uploads to its OWN throwaway
      # staging release (staging_tag below), so tauri-action's read-modify-write
      # of latest.json never touches a shared tag. The `assemble` job merges the
      # three per-platform manifests into the live `preview` release afterwards.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            staging_tag: preview-staging-macos
            args: '--config src-tauri/tauri.conf.preview.json --target universal-apple-darwin'
          - platform: ubuntu-latest
            staging_tag: preview-staging-linux
            args: '--config src-tauri/tauri.conf.preview.json'
          - platform: windows-latest
            staging_tag: preview-staging-windows
            args: '--config src-tauri/tauri.conf.preview.json'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            packages/app/src-tauri -> target
            crates/core -> target

      - run: pnpm install

      - name: Bump version for preview
        shell: bash
        run: node scripts/sync-version.mjs --preview ${{ needs.prepare.outputs.preview_num }}

      # Reset the throwaway staging release so a retry can't inherit stale
      # bundles from a previous attempt. Draft releases carry no git tag, so this
      # leaves no ref behind. Ignore "not found" on the first run.
      - name: Reset staging release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ matrix.staging_tag }}" \
            --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/app
          # Per-platform DRAFT staging release: invisible to users and creates no
          # git tag. tauri-action writes a correct, platform-complete latest.json
          # here; the assemble job merges the three into the live `preview`
          # manifest, so we never hand-maintain the platform-key map.
          tagName: ${{ matrix.staging_tag }}
          releaseName: 'Preview staging (${{ matrix.platform }})'
          releaseBody: 'Throwaway staging release — assembled into the preview release, then deleted.'
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  assemble:
    name: Assemble preview release & clean stale assets
    needs: [prepare, build]
    # Run even when one platform build failed, so leftover staging drafts are
    # always cleaned up. Each step guards itself so a partial build can never
    # corrupt the live updater manifest. Requires prepare's version string.
    if: always() && needs.prepare.result == 'success'
    permissions:
      contents: write # promotes staging assets to the preview release via gh
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      LIVE_TAG: preview
      MANIFEST_NAME: latest-preview.json
      STAGING_TAGS: 'preview-staging-macos preview-staging-linux preview-staging-windows'
    steps:
      - name: Promote staged bundles & merge updater manifest
        # Only when EVERY platform built. On a partial failure we skip this so
        # the prior preview bundles + latest-preview.json keep serving the last
        # fully-good build. --clobber overwrites atomically, so installed Preview
        # clients always see a consistent manifest.
        if: needs.build.result == 'success'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          NOTES="Rolling preview build from commit $GITHUB_SHA. Production data is unaffected — preview installs as a separate app."

          # Ensure the live rolling `preview` release exists to receive assets.
          if ! gh release view "$LIVE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$LIVE_TAG" --repo "$REPO" \
              --prerelease --title "Jot Deck Preview ($VERSION)" \
              --notes "$NOTES" --target "$GITHUB_SHA"
          fi

          norm_manifests=()
          for tag in $STAGING_TAGS; do
            dir="$work/$tag"
            mkdir -p "$dir"
            # Pull every asset from the staging draft (bundles, .sig, latest.json).
            gh release download "$tag" --repo "$REPO" --dir "$dir"

            # Move bundles + signatures onto the live preview release. Filenames
            # embed the version so platforms never collide; --clobber makes
            # retries idempotent.
            find "$dir" -type f ! -name 'latest.json' -print0 \
              | xargs -0 -r gh release upload "$LIVE_TAG" --repo "$REPO" --clobber

            # Rewrite this manifest's URLs from the staging tag to the live tag
            # (literal string replace — no regex), then keep just its platforms.
            from="/releases/download/$tag/"
            to="/releases/download/$LIVE_TAG/"
            jq --arg from "$from" --arg to "$to" \
              '.platforms |= with_entries(.value.url |= (split($from) | join($to)))' \
              "$dir/latest.json" > "$dir/norm.json"
            norm_manifests+=("$dir/norm.json")
          done

          # Merge the three platform-complete manifests into one. version/notes
          # are injected authoritatively (staging bodies are throwaway text);
          # pub_date is taken from the first, and the platform maps are unioned.
          jq -s --arg version "$VERSION" --arg notes "$NOTES" '{
            version: $version,
            notes: $notes,
            pub_date: .[0].pub_date,
            platforms: (reduce .[] as $m ({}; . + $m.platforms))
          }' "${norm_manifests[@]}" > "$work/$MANIFEST_NAME"

          gh release upload "$LIVE_TAG" "$work/$MANIFEST_NAME" \
            --repo "$REPO" --clobber

          # Keep release metadata in step with the freshly promoted build.
          gh release edit "$LIVE_TAG" --repo "$REPO" \
            --title "Jot Deck Preview ($VERSION)" --notes "$NOTES"

          # Roll the fixed `preview` tag to this commit (rolling-tag contract).
          # Only reached on a fully-successful promote, so the tag never points
          # at a partial build. Create the ref if it doesn't exist yet.
          gh api -X PATCH "repos/$REPO/git/refs/tags/$LIVE_TAG" \
            -f sha="$GITHUB_SHA" -F force=true 2>/dev/null \
          || gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/tags/$LIVE_TAG" -f sha="$GITHUB_SHA"

      - name: Delete staging releases
        # Always run — even on partial build failure — so throwaway drafts never
        # accumulate. Draft deletion removes no git tag.
        if: always()
        run: |
          set -euo pipefail
          for tag in $STAGING_TAGS; do
            gh release delete "$tag" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          done

      - name: Delete stale bundles from prior preview builds
        # Runs on every green-prepare run, including partial build failures, so
        # leftover bundles never accumulate. Bundle filenames embed the version;
        # two versions are protected from deletion:
        #   - VERSION: the version this run built (may be only partial)
        #   - the version the live latest-preview.json still points at
        # so we never delete the bundles installed clients are updating from.
        # On the very first run neither has assets yet and nothing is deleted.
        if: always()
        run: |
          set -euo pipefail
          # Version currently served to clients (empty until the first promote).
          tmpdir=$(mktemp -d)
          gh release download "$LIVE_TAG" --repo "$REPO" \
            --pattern "$MANIFEST_NAME" --dir "$tmpdir" 2>/dev/null || true
          LIVE_VERSION=$(jq -r '.version // empty' "$tmpdir/$MANIFEST_NAME" 2>/dev/null || true)
          echo "Keeping version '$VERSION'${LIVE_VERSION:+ and live version '$LIVE_VERSION'}"
          gh release view "$LIVE_TAG" \
            --repo "$REPO" \
            --json assets --jq '.assets[].name' \
          | while IFS= read -r asset; do
              case "$asset" in
                "$MANIFEST_NAME") continue ;;
                *"$VERSION"*) continue ;;
              esac
              if [ -n "$LIVE_VERSION" ]; then
                case "$asset" in
                  *"$LIVE_VERSION"*) continue ;;
                esac
              fi
              echo "Deleting stale asset: $asset"
              gh release delete-asset "$LIVE_TAG" "$asset" \
                --repo "$REPO" --yes
            done
