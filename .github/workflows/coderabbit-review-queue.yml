name: Queue CodeRabbit reviews

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: coderabbit-review-queue
  cancel-in-progress: false

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Request one eligible CodeRabbit review
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/coderabbit-review-queue.js').run({
              github, context, core,
            });
