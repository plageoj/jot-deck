name: Queue CodeRabbit reviews

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: coderabbit-review-queue
  cancel-in-progress: false

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Require a human-authenticated token
        env:
          CODERABBIT_REVIEW_PAT: ${{ secrets.CODERABBIT_REVIEW_PAT }}
        run: |
          if [ -z "$CODERABBIT_REVIEW_PAT" ]; then
            echo "::error::Set the CODERABBIT_REVIEW_PAT repository secret to a human user's token."
            exit 1
          fi

      - name: Request one eligible CodeRabbit review
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.CODERABBIT_REVIEW_PAT }}
          script: |
            await require('./.github/scripts/coderabbit-review-queue.js').run({
              github, context, core,
            });
