[package]
name = "jot-deck-tauri"
version = "0.1.0"
description = "Jot Deck - Fast drafting tool"
authors = ["plageoj"]
edition = "2021"

[lib]
name = "jot_deck_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jot-deck-core = { path = "../../../crates/core" }
# Reporter host: JSON-RPC dispatch + per-Reporter scope (007-reporter-protocol.md).
jot-deck-reporter-host = { path = "../../../crates/reporter-host" }
# The host spawns Reporter children and pumps their stdio; tauri::async_runtime
# is tokio, so we reuse that runtime and pull only the process/io/sync pieces.
tokio = { version = "1", features = ["process", "io-util", "sync"] }
# Assign a ULID to each Reporter registration.
ulid = "3"
